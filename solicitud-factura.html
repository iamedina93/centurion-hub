<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Factura (Control Interno) — Centurion Llantas</title>
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --panel:#f4f4f4;
    --line:#e2e2e2;
    --orange:#ec7a1e;
    --orange-dark:#c9640f;
    --muted:#8a8a8a;
    --dark:#111;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Segoe UI', Roboto, Arial, sans-serif;background:#e9e9e9;color:var(--ink);padding:28px 16px;
  }
  .sheet{max-width:820px;margin:0 auto;background:var(--paper);border-radius:10px;overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.10);}

  .brand-strip{height:5px;background:linear-gradient(90deg,var(--orange),var(--orange-dark));}
  .head{
    display:flex;justify-content:center;align-items:center;
    padding:20px 26px;background:#fff;border-bottom:2px solid var(--dark);gap:14px;text-align:center;
  }
  .titles{text-align:center;}
  .titles h1{margin:0;font-size:19px;font-weight:800;color:var(--dark);letter-spacing:.3px;}
  .titles .sub{color:var(--orange-dark);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-top:4px;}

  section{padding:20px 26px;border-top:1px solid var(--line);}
  section:nth-of-type(even){background:#fbfbfb;}
  .section-title{
    font-size:12.5px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title .n{
    width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 2px 5px rgba(236,122,30,.4);
  }

  /* SELECTOR TIPO CHIP */
  .chip-group{display:flex;flex-wrap:wrap;gap:9px;}
  .chip{
    border:1.5px solid var(--line);border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;
    color:var(--ink);cursor:pointer;background:#fff;transition:.15s;user-select:none;
  }
  .chip:hover{border-color:var(--orange);color:var(--orange-dark);}
  .chip input{display:none;}
  .chip.checked{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 8px rgba(236,122,30,.35);}

  /* TABLA */
  table{width:100%;border-collapse:collapse;margin-top:4px;}
  table#tabla-productos{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  th{background:var(--dark);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:9px 8px;text-align:left;}
  td{padding:8px 6px;border-bottom:1px solid var(--line);}
  tbody tr:nth-child(even){background:#faf7f4;}
  tbody tr:last-child td{border-bottom:none;}
  td input{width:100%;border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:12.5px;font-family:inherit;background:#fff;}
  td input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(236,122,30,.12);}
  .col-num input{text-align:right;}
  .row-del{background:none;border:none;color:#b23b2e;cursor:pointer;font-size:12.5px;font-weight:600;padding:4px 6px;}
  .row-del:hover{color:#8a2a20;}
  .table-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:12px;}
  .add-btn{
    background:#fdece0;color:var(--orange-dark);border:1px solid #f5c298;border-radius:6px;
    padding:7px 15px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .add-btn:hover{background:#fbdcc0;}

  .totales{margin-top:16px;display:flex;justify-content:center;}
  .totales table{width:auto;min-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;}
  .totales td{border-bottom:none;padding:6px 14px;font-size:13px;}
  .totales td:first-child{color:var(--muted);}
  .totales td:last-child{text-align:right;font-weight:700;}
  .totales tr.total td{font-size:16px;color:var(--orange-dark);border-top:2px solid var(--dark);padding-top:10px;}

  .bar{display:flex;gap:10px;justify-content:flex-end;padding:18px 26px 26px;}
  .btn{border:none;border-radius:7px;padding:11px 20px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 3px 10px rgba(236,122,30,.35);}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-secondary{background:#fff;color:var(--dark);border:1px solid var(--line);}
  .btn-secondary:hover{background:var(--panel);}

  .obs-box{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;
    font-family:inherit;min-height:60px;resize:vertical;background:#fff;
  }
  .obs-box:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(236,122,30,.12);}

  .col-num{position:relative;}
  .money-print{display:none;}

  /* MODO IMPRESIÓN (activado por JS, más confiable que solo @media print) */
  body.print-mode .costo-bruto, body.print-mode .costo-neto{ display:none; }
  body.print-mode .money-print{ display:inline-block; font-weight:700; }
  body.print-mode .bar, body.print-mode .row-del, body.print-mode .add-btn{ display:none !important; }
  body.print-mode .chip:not(.checked){ display:none !important; }
  body.print-mode .chip-group{ min-height:1px; }
  body.print-mode .chip.checked{
    border:none; background:none; color:var(--dark); box-shadow:none;
    font-size:19px; font-weight:800; padding:2px 0; letter-spacing:.2px;
  }
  body.print-mode .chip-group:empty::after,
  body.print-mode .chip-group:not(:has(.checked))::after{
    content:"— Sin especificar —"; color:var(--muted); font-size:13px; font-style:italic;
  }
  body.print-mode section:nth-of-type(even){ background:#fff; }
  body.print-mode .sheet{ box-shadow:none; }
  body.print-mode td input::placeholder{ color:transparent; }

  @media print{
    @page{ size:8.5in 5.5in; margin:6mm; }
    body{background:#fff;padding:0;font-size:10px;}
    .sheet{border:none;max-width:100%;box-shadow:none;}
    .bar, .row-del, .add-btn{display:none !important;}
    section:nth-of-type(even){background:#fff;}
    .head{padding:7px 18px;}
    .logo-img{height:18px;}
    section{padding:8px 18px;}
    .chip{padding:5px 11px;font-size:11px;box-shadow:none !important;}
    .chip:not(.checked){display:none !important;}
    .chip.checked{border:none;background:none;color:var(--dark);box-shadow:none;font-size:15px;font-weight:800;padding:2px 0;}
    .chip-group:not(:has(.checked))::after{content:"— Sin especificar —";color:var(--muted);font-size:11px;font-style:italic;}
    th{padding:4px 6px;font-size:9px;}
    td{padding:3px 4px;}
    td input{padding:2px 4px;font-size:11px;}
    td input::placeholder{color:transparent;}
    .costo-bruto, .costo-neto{display:none;}
    .money-print{display:inline-block;font-weight:700;}
    .totales{margin-top:8px;}
    .obs-box{min-height:32px;padding:6px 8px;font-size:10px;}
    section{padding:6px 18px;}
  }
  @media (max-width:640px){
    .head{padding:10px 16px;gap:8px;}
    .logo-img{height:20px;}
    .folio-box{min-width:100px;}

    table#tabla-productos, table#tabla-productos thead, table#tabla-productos tbody,
    table#tabla-productos th, table#tabla-productos tr{ display:block; }
    table#tabla-productos thead{ display:none; }
    table#tabla-productos tr{
      border:1px solid var(--line); border-radius:8px; margin-bottom:12px; padding:8px 10px;
    }
    table#tabla-productos td{
      display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px solid var(--line); padding:8px 2px; gap:10px;
    }
    table#tabla-productos td:last-child{ border-bottom:none; padding-top:4px; justify-content:flex-end; }
    table#tabla-productos td::before{
      content:attr(data-label); font-size:11px; color:var(--muted); font-weight:600; flex-shrink:0;
    }
    table#tabla-productos td input{ text-align:right; max-width:60%; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="brand-strip"></div>
  <div class="head">
    <div class="titles">
      <h1>Solicitud de Factura</h1>
      <div class="sub">Control Interno</div>
    </div>
  </div>

  <!-- 1. FACTURA -->
  <section>
    <div class="section-title"><span class="n">1</span>Factura</div>
    <div class="chip-group" data-group="factura">
      <label class="chip"><input type="radio" name="factura" value="Contado">Contado</label>
      <label class="chip"><input type="radio" name="factura" value="Crédito">Crédito</label>
      <label class="chip"><input type="radio" name="factura" value="Remisión">Remisión</label>
    </div>
  </section>

  <!-- 2. RAZÓN SOCIAL -->
  <section>
    <div class="section-title"><span class="n">2</span>Razón social</div>
    <div class="chip-group" data-group="razon">
      <label class="chip"><input type="radio" name="razon" value="Cliente nuevo">Cliente nuevo</label>
      <label class="chip"><input type="radio" name="razon" value="Venta de mostrador">Venta de mostrador</label>
      <label class="chip"><input type="radio" name="razon" value="Cliente registrado">Cliente registrado</label>
    </div>
  </section>

  <!-- 3. TABLA -->
  <section>
    <div class="section-title"><span class="n">3</span>Productos / Servicios</div>
    <table id="tabla-productos">
      <thead>
        <tr>
          <th style="width:12%">Cantidad</th>
          <th style="width:16%">Medida</th>
          <th style="width:28%">Descripción</th>
          <th style="width:16%">Costo bruto</th>
          <th style="width:14%">Costo neto</th>
          <th style="width:14%">IVA (16%)</th>
          <th style="width:4%"></th>
        </tr>
      </thead>
      <tbody id="cuerpo-productos"></tbody>
    </table>
    <div class="table-actions">
      <button type="button" class="add-btn" id="btn-add-row">+ Agregar renglón</button>
    </div>
    <div class="totales">
      <table>
        <tr><td>Subtotal (base)</td><td id="tot-subtotal">$0.00</td></tr>
        <tr><td>IVA (16%)</td><td id="tot-iva">$0.00</td></tr>
        <tr class="total"><td>Total</td><td id="tot-total">$0.00</td></tr>
      </table>
    </div>
  </section>

  <!-- 4. FORMA DE PAGO -->
  <section>
    <div class="section-title"><span class="n">4</span>Forma de pago</div>
    <div class="chip-group" data-group="forma-pago">
      <label class="chip"><input type="radio" name="forma-pago" value="Por definir">Por definir</label>
      <label class="chip"><input type="radio" name="forma-pago" value="Tarjeta débito">Tarjeta débito</label>
      <label class="chip"><input type="radio" name="forma-pago" value="Tarjeta crédito">Tarjeta crédito</label>
      <label class="chip"><input type="radio" name="forma-pago" value="Transferencia">Transferencia</label>
      <label class="chip"><input type="radio" name="forma-pago" value="Efectivo">Efectivo</label>
    </div>
  </section>

  <!-- 5. USO DE CFDI -->
  <section>
    <div class="section-title"><span class="n">5</span>Uso de CFDI</div>
    <div class="chip-group" data-group="uso-cfdi">
      <label class="chip"><input type="radio" name="uso-cfdi" value="Adquisición de mercancías">Adquisición de mercancías</label>
      <label class="chip"><input type="radio" name="uso-cfdi" value="Gastos en general">Gastos en general</label>
      <label class="chip"><input type="radio" name="uso-cfdi" value="Sin efectos fiscales">Sin efectos fiscales</label>
    </div>
  </section>

  <!-- 6. METODO DE PAGO -->
  <section>
    <div class="section-title"><span class="n">6</span>Método de pago</div>
    <div class="chip-group" data-group="metodo-pago">
      <label class="chip"><input type="radio" name="metodo-pago" value="PUE">PUE</label>
      <label class="chip"><input type="radio" name="metodo-pago" value="PPD">PPD</label>
    </div>
  </section>

  <!-- 7. OBSERVACIONES -->
  <section>
    <div class="section-title"><span class="n">7</span>Observaciones</div>
    <textarea id="observaciones" class="obs-box" placeholder="Notas adicionales..."></textarea>
  </section>

  <div class="bar">
    <button class="btn btn-secondary" id="btn-limpiar">Limpiar formulario</button>
    <button class="btn btn-primary" id="btn-pdf">Generar PDF</button>
  </div>
</div>

<script>
// CHIPS: click para marcar visualmente
document.querySelectorAll('.chip-group').forEach(group=>{
  group.addEventListener('click', (e)=>{
    const label = e.target.closest('.chip');
    if(!label) return;
    group.querySelectorAll('.chip').forEach(c=>c.classList.remove('checked'));
    label.classList.add('checked');
  });
});

// TABLA
function crearFila(){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="col-num" data-label="Cantidad"><input type="text" class="cantidad" placeholder="1"></td>
    <td data-label="Medida"><input type="text" class="medida" placeholder="Ej. 295/80R22.5"></td>
    <td data-label="Descripción"><input type="text" class="descripcion" placeholder="Descripción"></td>
    <td class="col-num" data-label="Costo bruto"><input type="number" class="costo-bruto" placeholder="0.00" step="0.01"><span class="money-print"></span></td>
    <td class="col-num" data-label="Costo neto"><input type="number" class="costo-neto" placeholder="0.00" step="0.01"><span class="money-print"></span></td>
    <td class="col-num" data-label="IVA (16%)"><input type="text" class="iva-calc" readonly placeholder="$0.00"></td>
    <td data-label=""><button type="button" class="row-del" title="Eliminar renglón">✕ Eliminar</button></td>
  `;
  return tr;
}

const cuerpo = document.getElementById('cuerpo-productos');

function agregarFila(){
  const tr = crearFila();
  cuerpo.appendChild(tr);
  const bruto = tr.querySelector('.costo-bruto');
  const neto = tr.querySelector('.costo-neto');
  const cant = tr.querySelector('.cantidad');

  bruto.addEventListener('input', ()=>{
    const v = parseFloat(bruto.value);
    if(!isNaN(v)) neto.value = (v*1.16).toFixed(2);
    else neto.value = '';
    calcularTotales();
  });
  neto.addEventListener('input', ()=>{
    const v = parseFloat(neto.value);
    if(!isNaN(v)) bruto.value = (v/1.16).toFixed(2);
    else bruto.value = '';
    calcularTotales();
  });
  cant.addEventListener('input', calcularTotales);
  tr.querySelector('.row-del').addEventListener('click', ()=>{ tr.remove(); calcularTotales(); });
}

function fmtMoney(v){
  return '$' + v.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function calcularTotales(){
  let subtotalBase = 0;
  let ivaAcum = 0;
  let totalPagado = 0;
  cuerpo.querySelectorAll('tr').forEach(tr=>{
    const cantVal = parseFloat(tr.querySelector('.cantidad').value) || 1;
    const netoInput = tr.querySelector('.costo-neto');
    const brutoInput = tr.querySelector('.costo-bruto');
    const netoVal = parseFloat(netoInput.value) || 0;
    const brutoVal = parseFloat(brutoInput.value) || 0;
    const importeNeto = cantVal * netoVal;
    const importeBase = cantVal * brutoVal;
    const importeIva = importeNeto - importeBase;
    tr.querySelector('.iva-calc').value = netoVal ? fmtMoney(importeIva) : '';
    brutoInput.parentElement.querySelector('.money-print').textContent = brutoVal ? fmtMoney(brutoVal) : '';
    netoInput.parentElement.querySelector('.money-print').textContent = netoVal ? fmtMoney(netoVal) : '';
    subtotalBase += importeBase;
    ivaAcum += importeIva;
    totalPagado += importeNeto;
  });
  document.getElementById('tot-subtotal').textContent = fmtMoney(subtotalBase);
  document.getElementById('tot-iva').textContent = fmtMoney(ivaAcum);
  document.getElementById('tot-total').textContent = fmtMoney(totalPagado);
}

document.getElementById('btn-add-row').addEventListener('click', agregarFila);
document.getElementById('btn-pdf').addEventListener('click', ()=>{
  document.body.classList.add('print-mode');
  window.print();
});
window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('print-mode');
});

document.getElementById('btn-limpiar').addEventListener('click', ()=>{
  if(confirm('¿Seguro que quieres limpiar todo el formulario?')){
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('checked'));
    document.querySelectorAll('.chip input').forEach(i=>i.checked=false);
    cuerpo.innerHTML = '';
    agregarFila();
    calcularTotales();
  }
});

// filas iniciales
for(let i=0;i<3;i++) agregarFila();
</script>

</body>
</html>
